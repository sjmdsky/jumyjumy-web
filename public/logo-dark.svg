  </defs>
  <text x="50%" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="850" letter-spacing="-2px">
    <tspan fill="url(#dark_sunset_j1)">J</tspan><tspan fill="#f8fafc">umy</tspan><tspan fill="url(#dark_sunset_j2)">J</tspan><tspan fill="#f8fafc">umy</tspan>
